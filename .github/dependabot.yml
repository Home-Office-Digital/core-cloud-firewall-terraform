version: 2
updates:
    # Enable Github Action updates
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "daily"
      commit-message:
          prefix: "chore(GHA)"
      labels:
          - "dependencies"
          - "patch"
          - "actions"
      groups:
          # One group for everything, majors included, since an action
          # major is usually just a runtime bump
          github-actions-all:
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"
                  - "major"

    # Enable TF updates for Terraform Projects.
    # directories supports globs; directory does not.
    # ** reaches nested modules such as inspection/stateful.
    - package-ecosystem: "terraform"
      directories:
          - "/modules/**"
      schedule:
          interval: "daily"
      commit-message:
          prefix: "chore(TF)"
      labels:
          - "dependencies"
          - "patch"
          - "terraform"
      groups:
          terraform-security:
              applies-to: security-updates
              patterns:
                  - "*"
          terraform-minor-and-patch:
              applies-to: version-updates
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"
              # One PR per dependency across every module directory
              group-by: "dependency-name"
